name: Fenix Announcement Scraper

on:
  schedule:
    - cron: '17 * * * *' # Checks every hour, at :17 past
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        env:
          FENIX_RSS_URL: ${{ secrets.FENIX_RSS_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FENIX_SESSION_COOKIE: ${{ secrets.FENIX_SESSION_COOKIE }}
        run: python bot.py

      - name: Save state & push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_announcements.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen announcements" && git push)
